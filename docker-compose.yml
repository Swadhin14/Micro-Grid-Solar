version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: microgrid_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-microgrid}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microgrid"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microgrid-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microgrid_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microgrid
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_jwt_key_microgrid_2026_change_in_production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEMO_MODE: "true"
      SIMULATION_REFRESH_SECONDS: 10
      DEFAULT_ADMIN_EMAIL: admin@microgrid.io
      DEFAULT_ADMIN_PASSWORD: Admin@12345
      DEFAULT_OPERATOR_EMAIL: operator@microgrid.io
      DEFAULT_OPERATOR_PASSWORD: Operator@12345
      DEFAULT_ANALYST_EMAIL: analyst@microgrid.io
      DEFAULT_ANALYST_PASSWORD: Analyst@12345
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - microgrid-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microgrid_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - microgrid-network

volumes:
  pgdata:
    driver: local

networks:
  microgrid-network:
    driver: bridge
